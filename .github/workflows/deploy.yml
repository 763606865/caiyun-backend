name: Deploy to Aliyun ECS

on:
  push:
    branches:
      - main
  workflow_dispatch:

# 同一时间只允许一个生产部署运行，避免迁移和构建互相冲突。
concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20

    steps:
      - name: Deploy through SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          # ALIYUN_HOST 和 ALIYUN_USER 也可改成固定值或 GitHub Variables；
          # ALIYUN_SSH_KEY 必须是能够登录 ECS 的私钥，不能提交到仓库。
          host: ${{ secrets.ALIYUN_HOST }}
          username: ${{ secrets.ALIYUN_USER }}
          key: ${{ secrets.ALIYUN_SSH_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 20m
          script: |
            set -euo pipefail

            readonly PROJECT_DIR="/var/www/caiyun-backend/current"

            cd "$PROJECT_DIR"

            # Vite 构建时 Wayfinder 会重新生成这些已被 Git 跟踪的源码目录。
            # 无论后续命令成功还是失败，都恢复生成文件，避免污染服务器工作区。
            cleanup_generated_sources() {
              git restore --source=HEAD --worktree -- \
                resources/js/actions \
                resources/js/routes \
                resources/js/wayfinder

              # 删除构建期间新增、但当前提交中不存在的 Wayfinder 文件。
              git clean -fd -- \
                resources/js/actions \
                resources/js/routes \
                resources/js/wayfinder
            }
            trap cleanup_generated_sources EXIT

            # ECS 上的 SSH 公钥已配置成 GitHub Deploy key，因此这里可以拉取私有仓库。
            # .env 等未被 Git 跟踪的生产文件不会被 reset 删除。
            git fetch --prune origin main
            git reset --hard origin/main

            composer install \
              --no-dev \
              --prefer-dist \
              --optimize-autoloader \
              --no-interaction

            npm ci
            npm run build

            # public/build 已被 .gitignore 忽略；恢复的只是 Wayfinder 源码，
            # 不会影响刚生成的生产构建产物。
            cleanup_generated_sources

            # npm ci 和构建流程都不应修改任何已跟踪文件。发现异常时立即终止部署，
            # 并输出具体文件，避免把脏工作区留给下一次发布。
            if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
              git status --short --untracked-files=no
              echo "Deployment aborted: tracked files were modified during build." >&2
              exit 1
            fi

            php artisan storage:link || true
            php artisan optimize:clear
            php artisan migrate --force
            php artisan optimize
            php artisan db:seed --force --class=AdminAuthorizationSeeder

            sudo chown -R "$(id -un)":www-data storage bootstrap/cache
            sudo find storage bootstrap/cache -type d -exec chmod 775 {} \;
            sudo find storage bootstrap/cache -type f -exec chmod 664 {} \;

            if [ -f storage/oauth-private.key ]; then
              chmod 600 storage/oauth-private.key
            fi
            if [ -f storage/oauth-public.key ]; then
              chmod 600 storage/oauth-public.key
            fi

            php artisan horizon:terminate || true
            sudo systemctl reload php8.5-fpm
            sudo supervisorctl reread
            sudo supervisorctl update
            sudo supervisorctl restart 'caiyun-backend-horizon:*' || \
              sudo supervisorctl start 'caiyun-backend-horizon:*'
            sudo supervisorctl restart 'caiyun-backend-octane:*' || \
              sudo supervisorctl start 'caiyun-backend-octane:*'

            trap - EXIT
            echo "Deployment completed: $(git rev-parse --short HEAD)"
